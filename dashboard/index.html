<body>

<div class="preview-banner" id="preview-banner" hidden>Browser preview. TV controls are simulated.</div>
<main class="shell" id="shell">
  <header class="masthead">
    <h1 class="visually-hidden">Inputs</h1>
    <nav class="tools" aria-label="TV controls">
      <button id="lg-home" data-app="com.webos.app.home" data-label="LG Home" data-busy="Opening…"><svg aria-hidden="true"><use href="#home"/></svg><span data-status>LG Home</span></button>
      <button id="game" data-app="com.webos.app.gameoptimizer" data-label="Game Optimizer" data-busy="Opening…"><svg aria-hidden="true"><use href="#controller"/></svg><span data-status>Game Optimizer</span><span class="remote-key yellow" title="Yellow button"></span></button>
      <button id="tv-settings" data-app="com.palm.app.settings" data-label="TV Settings" data-busy="Opening…"><svg aria-hidden="true"><use href="#settings"/></svg><span data-status>TV Settings</span><span class="remote-key blue" title="Blue button"></span></button>
    </nav>
    <div class="clock"><span id="clock-date"></span><time id="clock-time">--:--</time></div>
  </header>
  <section class="sources" aria-label="HDMI inputs">
    <button class="source xbox" id="xbox" data-app="com.webos.app.hdmi2" data-label="Xbox Series X" data-busy="Switching to HDMI 2…" aria-describedby="xbox-input">
      <div class="console-art" aria-hidden="true">
        <img src="xsx.png" alt="" width="1000" height="1000" decoding="async">
      </div>
      <span class="source-copy"><strong>Xbox Series X</strong><span class="source-action"><span id="xbox-input" data-status>Switch to HDMI 2</span></span></span>
    </button>
    <div class="other-inputs">
      <button class="source secondary" id="hdmi1" data-app="com.webos.app.hdmi1" data-label="HDMI 1" data-busy="Switching…"><svg aria-hidden="true"><use href="#port"/></svg><span><strong>HDMI 1</strong><span class="secondary-label" data-status></span></span></button>
      <button class="source secondary" id="hdmi3" data-app="com.webos.app.hdmi3" data-label="HDMI 3" data-busy="Switching…"><svg aria-hidden="true"><use href="#port"/></svg><span><strong>HDMI 3</strong><span class="secondary-label" data-status></span></span></button>
      <button class="source secondary" id="hdmi4" data-app="com.webos.app.hdmi4" data-label="HDMI 4" data-busy="Switching…"><svg aria-hidden="true"><use href="#port"/></svg><span><strong>HDMI 4</strong><span class="secondary-label" data-status></span></span></button>
    </div>
  </section>
  <nav class="apps" aria-label="Apps">
    <button class="app-tile" id="apple-tv" data-app="com.apple.appletv" data-label="Apple TV" data-busy="Opening Apple TV…"><svg class="brand-logo apple-logo" aria-hidden="true"><use href="#apple-tv-logo"/></svg><span data-status>Apple TV</span></button>
    <button class="app-tile" id="youtube" data-app="youtube.leanback.v4" data-label="YouTube" data-busy="Opening YouTube…"><svg class="brand-logo" aria-hidden="true"><use href="#youtube-logo"/></svg><span data-status>YouTube</span></button>
    <button class="app-tile" id="browser" data-app="com.webos.app.browser" data-label="Browser" data-busy="Opening Browser…"><svg aria-hidden="true"><use href="#web"/></svg><span data-status>Browser</span></button>
  </nav>
  <footer><span><span class="keycap">Back</span>returns to Xbox</span></footer>
</main>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div id="sleep-cover" class="sleep-cover" aria-hidden="true" hidden></div>
<script src="ports.js"></script>
<script src="app.js"></script>
</body>
</html>
